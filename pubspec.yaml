name: cyclesync
description: "CycleSync: private menstrual cycle and wellness tracker."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.5.0

# Packages are added with `flutter pub add` (see README) so that versions
# are resolved against the installed Flutter SDK and locked in pubspec.lock.
dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_riverpod: ^3.5.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  web: ^1.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
